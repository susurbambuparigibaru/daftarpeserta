<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Pendaftaran - Susur Bambu Parigi Baru</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url('background-event.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(27, 94, 32, 0.3);
            width: 100%;
            max-width: 460px;
            text-align: center;
            backdrop-filter: blur(6px);
            border: 2px solid rgba(165, 214, 167, 0.5);
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, #1b5e20, #4ade80, #facc15);
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
        }

        h2 {
            color: #1b5e20;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #4b5563;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #c8e6c9; 
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f9fbf9;
        }

        input[type="text"]:focus {
            border-color: #1b5e20;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(27, 94, 32, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #facc15, #eab308); 
            color: #1e293b; 
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #fde047, #ca8a04);
            box-shadow: 0 6px 16px rgba(234, 179, 8, 0.4);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            display: none;
            text-align: left;
            animation: fadeIn 0.3s ease-in-out;
            max-height: 320px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .terdaftar {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-left: 5px solid #166534;
        }

        .tidak-terdaftar {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-left: 5px solid #991b1b;
        }

        .result h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
        }

        .item-nama {
            padding: 10px 0;
            border-bottom: 1px dashed #c8e6c9;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .item-nama:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cek Pendaftaran</h2>
    <p class="subtitle">Susur Bambu Parigi Baru Volume 2</p>
    
    <div class="search-box">
        <input type="text" id="inputNama" placeholder="Ketik nama lengkap Anda...">
    </div>
    <button onclick="cariNama()">Periksa Kepesertaan</button>

    <div id="boxHasil" class="result"></div>
</div>

<script>
    // URL Google Apps Script Web App resmi terbaru milik Anda
    const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbxaswsrIcM8T2__OsHnYORdhTYdq8Cg6mcbLJTEUCHBGkK_fxFlr-wJ5uETfsCF6vEd/exec'; 

    async function cariNama() {
        const input = document.getElementById("inputNama").value.trim().toLowerCase();
        const boxHasil = document.getElementById("boxHasil");
        
        if (input === "") {
            alert("Silakan ketik nama terlebih dahulu!");
            return;
        }

        if (input.length < 3) {
            alert("Mohon masukkan minimal 3 karakter untuk melakukan pencarian!");
            return;
        }

        boxHasil.style.display = "block";
        boxHasil.className = "result loading";
        boxHasil.innerHTML = "<h3>🔄 Mohon tunggu...</h3><p>Sedang memeriksa basis data pendaftaran secara real-time.</p>";

        try {
            const response = await fetch(appsScriptUrl);
            if (!response.ok) throw new Error();
            const listPeserta = await response.json();
            
            // Mengumpulkan semua peserta yang namanya cocok
            let hasilPencarian = [];
            for (let i = 0; i < listPeserta.length; i++) {
                if (listPeserta[i].nama && listPeserta[i].nama.toLowerCase().includes(input)) {
                    hasilPencarian.push(listPeserta[i]);
                }
            }

            if (hasilPencarian.length > 0) {
                boxHasil.className = "result terdaftar";
                
                let htmlKonten = `<h3>🎉 ${hasilPencarian.length} Nama Ditemukan!</h3>`;
                hasilPencarian.forEach(peserta => {
                    htmlKonten += `
                        <div class="item-nama">
                            <strong>Nama Lengkap:</strong> ${peserta.nama}<br>
                            <strong>Domisili:</strong> ${peserta.domisili}<br>
                            <span style="color: #166534; font-size: 12px; font-weight: bold;">Status Kepesertaan: Terverifikasi ✅</span>
                        </div>
                    `;
                });
                
                boxHasil.innerHTML = htmlKonten;
            } else {
                boxHasil.className = "result tidak-terdaftar";
                boxHasil.innerHTML = `
                    <h3>❌ Nama Tidak Ditemukan</h3>
                    <p>Nama tidak terdata atau salah ejaan. Silakan periksa kembali nama lengkap yang Anda masukkan.</p>
                `;
            }

        } catch (error) {
            console.error(error);
            boxHasil.className = "result tidak-terdaftar";
            boxHasil.innerHTML = `
                <h3>⚠️ Koneksi Sinkronisasi Gagal</h3>
                <p>Terjadi kendala saat mengambil data. Harap muat ulang halaman atau periksa kembali status deployment Web App Anda.</p>
            `;
        }
    }
    
    // Fitur klik tombol enter di keyboard
    document.getElementById("inputNama").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { cariNama(); }
    });
</script>

</body>
</html>
